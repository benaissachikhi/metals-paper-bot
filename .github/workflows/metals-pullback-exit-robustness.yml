name: Metals Pullback Exit Robustness

on:
  workflow_dispatch:

jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance

      - name: Compile
        run: |
          python -m py_compile research_metals_stocks.py
          python -m py_compile research_metals_pullback.py
          python -m py_compile research_metals_pullback_exit_robustness.py

      - name: Run exit robustness
        run: |
          python research_metals_pullback_exit_robustness.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metals-pullback-exit-robustness-results
          path: |
            metals_pullback_exit_summary.json
            metals_pullback_exit_comparison.csv
            metals_pullback_exit_yearly.csv
            metals_pullback_exit_trades.csv
          if-no-files-found: warn
          retention-days: 30
