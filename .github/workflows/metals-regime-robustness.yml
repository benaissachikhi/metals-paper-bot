name: Metals Regime Robustness

on:
  workflow_dispatch:

jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance

      - name: Compile
        run: |
          python -m py_compile research_metals_stocks.py
          python -m py_compile research_metals_regime_gate.py

      - name: Run robustness gate
        run: |
          python research_metals_regime_gate.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metals-regime-robustness-results
          path: |
            metals_regime_gate_summary.json
            metals_regime_gate_yearly.csv
            metals_regime_gate_oos_symbols.csv
            metals_regime_gate_comparison.csv
            metals_regime_gate_trades.csv
          if-no-files-found: warn
          retention-days: 30
