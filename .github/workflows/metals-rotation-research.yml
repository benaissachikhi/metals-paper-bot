name: Metals Rotation Research

on:
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance

      - name: Compile
        run: |
          python -m py_compile research_metals_rotation.py

      - name: Run rotation research
        run: |
          python research_metals_rotation.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metals-rotation-results
          path: |
            metals_rotation_summary.json
            metals_rotation_comparison.csv
            metals_rotation_oos_symbols.csv
            metals_rotation_yearly.csv
            metals_rotation_trades.csv
            metals_rotation_oos_equity.csv
          if-no-files-found: warn
          retention-days: 30
