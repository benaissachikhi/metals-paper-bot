name: Metals Rotation Risk Control

on:
  workflow_dispatch:

jobs:
  risk-control:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance

      - name: Compile
        run: |
          python -m py_compile research_metals_rotation.py
          python -m py_compile research_metals_rotation_risk.py

      - name: Run risk-control research
        run: |
          python research_metals_rotation_risk.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metals-rotation-risk-control-results
          path: |
            metals_rotation_risk_summary.json
            metals_rotation_risk_comparison.csv
            metals_rotation_risk_yearly.csv
            metals_rotation_risk_trades.csv
            metals_rotation_risk_oos_equity.csv
            metals_rotation_risk_exposure.csv
          if-no-files-found: warn
          retention-days: 30
